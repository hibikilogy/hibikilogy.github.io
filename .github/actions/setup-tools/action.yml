name: Setup CI Tools
description: Install project toolchain and dependencies for CI

inputs:
  node:
    description: 'Setup Node.js and pnpm'
    default: 'false'
  rust:
    description: 'Install Rust toolchain'
    default: 'false'
  zola:
    description: 'Install Zola'
    default: 'false'
  nextest:
    description: 'Install cargo-nextest'
    default: 'false'
  llvm-cov:
    description: 'Install cargo-llvm-cov'
    default: 'false'
  sccache:
    description: 'Install and enable sccache for Rust compilation caching'
    default: 'false'
  cache-shared-key:
    description: 'Shared Rust cache key'
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: pnpm

    - name: Install dependencies
      if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Rust artifacts (shared)
      if: inputs.rust == 'true' && inputs.cache-shared-key != ''
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-shared-key }}

    - name: Cache Rust artifacts
      if: inputs.rust == 'true' && inputs.cache-shared-key == ''
      uses: Swatinem/rust-cache@v2

    - name: Install sccache
      if: inputs.sccache == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: sccache
        fallback: none

    - name: Configure sccache
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        # SCCACHE_GHA_ENABLED is intentionally NOT set because ACTIONS_RESULTS_URL
        # and ACTIONS_RUNTIME_TOKEN are not exposed to bash steps within composite
        # actions, making the GHA cache backend non-functional. Cross-job caching
        # is handled by Swatinem/rust-cache (target/); sccache provides intra-job
        # caching across multiple cargo invocations within a single CI job.
        echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"

    - name: Setup Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: rustup show

    - name: Install Zola
      if: inputs.zola == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: zola@0.23.4
        fallback: none

    - name: Install cargo-nextest
      if: inputs.nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: nextest
        fallback: none

    - name: Install cargo-llvm-cov
      if: inputs.llvm-cov == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
        fallback: none
