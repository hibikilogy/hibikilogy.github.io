name: CHECK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      - '.editorconfig'
      - '.vscode/**'
      - '.zhlintrc'
      - '.markdownlintignore'
      - '.github/commit-convention.md'
      - '.github/dependabot.yml'
      - '.github/_typos.toml'
      - 'vercel.json'

  pull_request:
    branches: [next, main, dev]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      - '.editorconfig'
      - '.vscode/**'
      - '.zhlintrc'
      - '.markdownlintignore'
      - '.github/commit-convention.md'
      - '.github/dependabot.yml'
      - '.github/_typos.toml'
      - 'vercel.json'
  # 手动触发
  workflow_dispatch:

# 校验类工作流只读，按最小权限原则
permissions:
  contents: read

# 同一 PR / 分支的新运行取消旧的，避免 lint 排队堆积
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # fetch all commits to get last updated time or other git log info
          fetch-depth: 0

      # install pnpm before setup-node so the node cache (pnpm) can be enabled
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # pnpm version is read from package.json `packageManager` (pnpm@10.32.1)

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # node.js version is pinned by the repo (.nvmrc)
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @see https://github.com/dtolnay/rust-toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # @see https://github.com/Swatinem/rust-cache
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # zola check：校验模板、内部链接、配置（不生成产物）
      - name: Zola Check
        run: pnpm lint

      - name: ESLint
        run: pnpm lint:eslint

      - name: Typecheck
        run: pnpm typecheck

      # scripts/ 下的 Rust 脚本单元测试（convert_tests.rs 等通过 #[cfg(test)]
      # 挂在 html-img-host-rewrite bin 上，cargo test 会一并编译并执行）
      - name: Run cargo tests
        run: cargo test

      # 端到端冒烟：用真实 content + 字体跑一遍 title-font-subset，验证 bin 可编译可运行
      - name: "Smoke test: subset title font"
        run: pnpm build:subset-titlefont
