[files]
extend-exclude = [
  "**/*.json",
  "**/*.svg",
  "pnpm-lock.yaml",
  ".markdownlintignore",
  ".prettierignore",
  ".eslintrc.yml",
  # typos tokenizes binary file names, and upload names embed random hashes
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.webp",
  "**/*.gif",
  "**/*.ico",
  # Generated by Zola's Giallo highlighter from [markdown.highlighting]
  "**/giallo-*.css"
]

[default]
extend-ignore-re = [
  # Abbreviated git commit SHAs, whose hex fragments read as words
  '\b[0-9a-f]{7,40}\b',
  # English ordinal abbreviations written inline in Chinese prose (2nd, 3rd)
  '\d+(?:st|nd|rd|th)'
]

[default.extend-words]
# OpenType and AAT font table names
loca = "loca"
trak = "trak"
# Pen name of a guest author
Kindom = "Kindom"
# Romanization of 黑江真由, also used in slugs
Mayu = "Mayu"
mayu = "mayu"
# Deleuze's French terms (espace quelconque / strié / lisse, L'Image-mouvement)
espace = "espace"
mouvement = "mouvement"
# Placeholder in the math example table of content/docs/markdown.md
wha = "wha"
