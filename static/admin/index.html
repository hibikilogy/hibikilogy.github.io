<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>京吹学报 CMS (DEV)</title>
    <meta name="robots" content="noindex, nofollow">
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>window.React=window.React||{createElement:window.h||function(){}}</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
    CMS.registerPreviewStyle('/styles/uno.css');
    CMS.registerPreviewStyle('/styles/source-han-sans-sc-vf.css');
    CMS.registerPreviewStyle('/styles/source-han-sans-sc-vf.patch.css');
    CMS.registerPreviewStyle('/critical.css');
    CMS.registerPreviewStyle('/layouts/page.css');
    CMS.registerPreviewStyle('/layouts/docs.css');

    CMS.registerPreviewStyle('/admin/fonts.css');

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[0]} 年 ${parseInt(parts[1], 10)} 月 ${parseInt(parts[2], 10)} 日`;
    }

    const DocsPreview = createClass({
      render() {
        const { entry, widgetFor } = this.props;
        const title = entry.getIn(['data', 'title']) || '';

        return (
          <div id="app">
            <div className="Layout">
              <header className="Hero no-cover">
                <div className="container">
                  <div className="taxonomies-banner">
                    <div className="taxonomies-meta">
                      <h2 className="title">
                        <span className="banner-title">{title}</span>
                      </h2>
                    </div>
                  </div>
                </div>
              </header>
              <main className="Content">
                <div className="container">
                  <div className="content">
                    <section className="content-container">
                      <article>
                        {widgetFor('body')}
                      </article>
                    </section>
                  </div>
                </div>
              </main>

            </div>
          </div>
        );
      }
    });

    const PostPreview = createClass({
      componentDidMount() {
        const doc = this.props.document;
        if (!doc || doc.querySelector('#unocss-runtime')) return;

        const map = doc.createElement('script');
        map.type = 'importmap';
        map.textContent = JSON.stringify({
          imports: {
            '@unocss/runtime': 'https://esm.sh/@unocss/runtime',
            '@unocss/preset-wind4': 'https://esm.sh/@unocss/preset-wind4',
            '@unocss/preset-attributify': 'https://esm.sh/@unocss/preset-attributify',
          }
        });
        doc.head.appendChild(map);

        const script = doc.createElement('script');
        script.id = 'unocss-runtime';
        script.type = 'module';
        script.textContent = `
          import initRuntime from '@unocss/runtime';
          import presetWind4 from '@unocss/preset-wind4';
          import presetAttributify from '@unocss/preset-attributify';
          initRuntime({
            presets: [
              presetWind4({ preflights: false }),
              presetAttributify(),
            ],
            theme: {
              font: { family: 'var(--joh-font-family-base)' },
              breakpoint: { md: '720px' },
            },
          });
        `;
        doc.head.appendChild(script);
      },
      render() {
        const { entry, widgetFor } = this.props;

        const title = entry.getIn(['data', 'title']) || '';
        const description = entry.getIn(['data', 'description']) || '';
        const date = entry.getIn(['data', 'date']) || '';
        const cover = entry.getIn(['data', 'extra', 'cover']) || '';
        const coverAlt = entry.getIn(['data', 'extra', 'cover_alt']) || title;
        const author = entry.getIn(['data', 'taxonomies', 'author']);
        const tags = entry.getIn(['data', 'taxonomies', 'tags']);

        const hasCustomCover = !!cover;
        const hasDescription = !!description;
        const hasAuthor = author && author.size > 0;
        const hasTags = tags && tags.size > 0;
        const coverUrl = cover || '/imgs/tags.svg';

        return (
          <div id="app">
            <div className="Layout">

              {/* —— Hero — 对应 hero.html isPost 分支 —— */}
              <header className={`Hero ${hasCustomCover ? 'has-cover' : 'no-cover'}`}>
                <div className="container">
                  <div className="post-heading">
                    <img
                      className="article-cover"
                      src={coverUrl}
                      alt={coverAlt}
                    />
                    <div className="post-heading-gradient-overlay" />
                    <div className="post-heading-dark-overlay" />
                    <div className="post-heading-info">
                      <div className="post-heading-info-container">

                        {/* 标签 */}
                        <div className="post-heading-tags TagsList">
                          {hasTags && tags.toArray().map(tag => (
                            <a className="joh-tag" href="#" title={tag} key={tag}>
                              <span>{tag}</span>
                            </a>
                          ))}
                        </div>

                        {/* 标题 */}
                        <h1 className="post-heading-title">
                          <span className="PostTitleTransition">{title}</span>
                        </h1>

                        {/* 副标题 */}
                        {hasDescription && (
                          <p className="post-heading-subtitle">{description}</p>
                        )}

                        {/* 日期 + 作者 */}
                        <div className="post-heading-meta">
                          <time className="article-publish-date" datetime={date}>
                            发布于 {formatDate(date)}
                          </time>
                          <span className="article-authors">
                            <span className="author-title">作者</span>
                            {hasAuthor ? (
                              author.toArray().map((name, i) => (
                                <span key={name}>
                                  {i > 0 && <span className="author-separator">、</span>}
                                  <a className="article-author" href="#">
                                    <span className="author-name font-bold">{name}</span>
                                  </a>
                                </span>
                              ))
                            ) : (
                              <span className="author-name font-bold">京吹学报</span>
                            )}
                          </span>
                        </div>

                      </div>
                    </div>
                  </div>
                </div>
              </header>

              {/* —— 正文 —— */}
              <main className="Content has-aside">
                <div className="container">
                  <div className="content">
                    <section className="content-container">
                      <article>
                        {widgetFor('body')}
                      </article>
                    </section>
                  </div>
                </div>
              </main>

            </div>
          </div>
        );
      }
    });

    CMS.registerPreviewTemplate('posts', PostPreview);
    CMS.registerPreviewTemplate('docs', DocsPreview);
  </script>
  </body>
</html>
