<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>京吹学报 CMS (DEV)</title>
    <meta name="robots" content="noindex, nofollow">
  </head>

  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.170.5/dist/sveltia-cms.js"></script>

    <script>
      window.React = window.React || {
        createElement: window.h || function () {},
      };
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const PREVIEW_STYLES = [
        '/styles/uno.css',
        '/styles/source-han-sans-sc-vf.css',
        '/styles/source-han-sans-sc-vf.patch.css',
        '/critical.css',
        '/layouts/page.css',
        '/layouts/docs.css',
        '/layouts/author-profile.css',
        '/admin/fonts.css',
      ];

      PREVIEW_STYLES.forEach(style => {
        CMS.registerPreviewStyle(style);
      });

      const DEFAULT_COVER = '/imgs/tags.svg';
      const DEFAULT_AVATAR =
        'https://random-kumiko.interknot.site/api/v1/image/random';

      /**
       * 获取 entry.data 下的字段。
       */
      function getField(entry, path, fallback = '') {
        const keys = Array.isArray(path) ? path : [path];
        const value = entry.getIn(['data', ...keys]);

        return value == null ? fallback : value;
      }

      /**
       * 将 Immutable List 或普通数组统一转换成数组。
       */
      function toArray(value) {
        if (!value) return [];
        if (Array.isArray(value)) return value;
        if (typeof value.toArray === 'function') return value.toArray();

        return [];
      }

      /**
       * 格式化 YYYY-MM-DD 或 ISO 日期。
       */
      function formatDate(value) {
        if (!value) return '';

        const match = String(value).match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})/,
        );

        if (!match) return value;

        const [, year, month, day] = match;

        return `${year} 年 ${Number(month)} 月 ${Number(day)} 日`;
      }

      /**
       * 为没有协议的外部链接补充 https://。
       */
      function normalizeExternalUrl(value) {
        if (!value) return '';

        return /^https?:\/\//i.test(value)
          ? value
          : `https://${value}`;
      }

      function getDomain(value) {
        if (!value) return '';

        try {
          return new URL(normalizeExternalUrl(value)).hostname;
        } catch {
          return value;
        }
      }

      /**
       * 向预览 iframe 注入 UnoCSS Runtime。
       */
      function installUnoRuntime(doc) {
        if (!doc || doc.getElementById('unocss-runtime')) return;

        if (!doc.getElementById('unocss-importmap')) {
          const importMap = doc.createElement('script');

          importMap.id = 'unocss-importmap';
          importMap.type = 'importmap';
          importMap.textContent = JSON.stringify({
            imports: {
              '@unocss/runtime':
                'https://esm.sh/@unocss/runtime',
              '@unocss/preset-wind4':
                'https://esm.sh/@unocss/preset-wind4',
              '@unocss/preset-attributify':
                'https://esm.sh/@unocss/preset-attributify',
            },
          });

          doc.head.appendChild(importMap);
        }

        const runtime = doc.createElement('script');

        runtime.id = 'unocss-runtime';
        runtime.type = 'module';
        runtime.textContent = `
          import initRuntime from '@unocss/runtime';
          import presetWind4 from '@unocss/preset-wind4';
          import presetAttributify from '@unocss/preset-attributify';

          initRuntime({
            presets: [
              presetWind4({
                preflights: false,
              }),
              presetAttributify(),
            ],
            theme: {
              font: {
                family: 'var(--joh-font-family-base)',
              },
              breakpoint: {
                md: '720px',
              },
            },
          });
        `;

        doc.head.appendChild(runtime);
      }

      /**
       * 所有预览页面的公共根布局。
       */
      function PreviewPage({ hero, body, hasAside = false }) {
        return (
          <div id="app">
            <div className="Layout">
              {hero}

              {body && (
                <main className={`Content${hasAside ? ' has-aside' : ''}`}>
                  <div className="container">
                    <div className="content">
                      <section className="content-container">
                        {body}
                      </section>
                    </div>
                  </div>
                </main>
              )}
            </div>
          </div>
        );
      }

      function SimpleHero({ title }) {
        return (
          <header className="Hero no-cover">
            <div className="container">
              <div className="taxonomies-banner">
                <div className="taxonomies-meta">
                  <h2 className="title">
                    <span className="banner-title">{title}</span>
                  </h2>
                </div>
              </div>
            </div>
          </header>
        );
      }

      function Tags({ tags }) {
        if (!tags.length) return null;

        return (
          <div className="post-heading-tags TagsList">
            {tags.map((tag, index) => (
              <a
                className="joh-tag"
                href="#"
                title={tag}
                key={`${tag}-${index}`}
              >
                <span>{tag}</span>
              </a>
            ))}
          </div>
        );
      }

      function Authors({ authors }) {
        return (
          <span className="article-authors">
            <span className="author-title">作者</span>

            {authors.length ? (
              authors.map((name, index) => (
                <span key={`${name}-${index}`}>
                  {index > 0 && (
                    <span className="author-separator">、</span>
                  )}

                  <a className="article-author" href="#">
                    <span className="author-name font-bold">
                      {name}
                    </span>
                  </a>
                </span>
              ))
            ) : (
              <span className="author-name font-bold">
                京吹学报
              </span>
            )}
          </span>
        );
      }

      function PostHero({
        title,
        description,
        date,
        cover,
        coverAlt,
        authors,
        tags,
      }) {
        const hasCustomCover = Boolean(cover);
        const coverUrl = cover || DEFAULT_COVER;

        return (
          <header
            className={`Hero ${
              hasCustomCover ? 'has-cover' : 'no-cover'
            }`}
          >
            <div className="container">
              <div className="post-heading">
                <img
                  className="article-cover"
                  src={coverUrl}
                  alt={coverAlt}
                />

                <div className="post-heading-gradient-overlay" />
                <div className="post-heading-dark-overlay" />

                <div className="post-heading-info">
                  <div className="post-heading-info-container">
                    <Tags tags={tags} />

                    <h1 className="post-heading-title">
                      <span className="PostTitleTransition">
                        {title}
                      </span>
                    </h1>

                    {description && (
                      <p className="post-heading-subtitle">
                        {description}
                      </p>
                    )}

                    <div className="post-heading-meta">
                      <time
                        className="article-publish-date"
                        dateTime={date}
                      >
                        发布于 {formatDate(date)}
                      </time>

                      <Authors authors={authors} />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </header>
        );
      }

      function AuthorHero({
        title,
        bio,
        avatar,
        link,
      }) {
        const href = normalizeExternalUrl(link);
        const domain = getDomain(link);

        return (
          <header className="Hero no-cover">
            <div className="container">
              <div className="author-profile-banner">
                {avatar && (
                  <img
                    className="author-avatar"
                    src={avatar}
                    alt={title}
                    width="180"
                    height="180"
                  />
                )}

                <h2 className="author-profile-name">
                  <span className="author-profile-label">
                    作者
                  </span>
                  {title}
                </h2>

                {bio && (
                  <p className="author-profile-bio">
                    {bio}
                  </p>
                )}

                <div className="author-profile-meta">
                  <span className="author-profile-count">
                    XX 篇文章
                  </span>

                  {href && (
                    <a
                      className="author-profile-link joh-external-link-icon"
                      href={href}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {domain}
                    </a>
                  )}
                </div>
              </div>
            </div>
          </header>
        );
      }

      const DocsPreview = createClass({
        render() {
          const { entry, widgetFor } = this.props;
          const title = getField(entry, 'title');

          return (
            <PreviewPage
              hero={<SimpleHero title={title} />}
              body={
                <article>
                  {widgetFor('body')}
                </article>
              }
            />
          );
        },
      });

      const PostPreview = createClass({
        componentDidMount() {
          installUnoRuntime(this.props.document);
        },

        render() {
          const { entry, widgetFor } = this.props;

          const title = getField(entry, 'title');
          const description = getField(entry, 'description');
          const date = getField(entry, 'date');
          const cover = getField(entry, ['extra', 'cover']);
          const coverAlt = getField(
            entry,
            ['extra', 'cover_alt'],
            title,
          );
          const authors = toArray(
            getField(entry, ['taxonomies', 'author'], null),
          );
          const tags = toArray(
            getField(entry, ['taxonomies', 'tags'], null),
          );

          return (
            <PreviewPage
              hasAside
              hero={
                <PostHero
                  title={title}
                  description={description}
                  date={date}
                  cover={cover}
                  coverAlt={coverAlt}
                  authors={authors}
                  tags={tags}
                />
              }
              body={
                <article>
                  {widgetFor('body')}
                </article>
              }
            />
          );
        },
      });

      const AuthorsPreview = createClass({
        render() {
          const { entry } = this.props;

          const title = getField(entry, 'title', '作者名');
          const bio = getField(entry, 'bio', '我是座右铭');
          const avatar = getField(
            entry,
            'avatar',
            DEFAULT_AVATAR,
          );
          const link = getField(
            entry,
            'link',
            'blog.blogger.com',
          );

          return (
            <PreviewPage
              hero={
                <AuthorHero
                  title={title}
                  bio={bio}
                  avatar={avatar}
                  link={link}
                />
              }
            />
          );
        },
      });

      CMS.registerPreviewTemplate('posts', PostPreview);
      CMS.registerPreviewTemplate('docs', DocsPreview);
      CMS.registerPreviewTemplate('authors', AuthorsPreview);
    </script>
  </body>
</html>
