[package]
name = "hibikilogy-tools"
version = "0.1.0"
edition = "2021"

[lib]
path = "scripts/lib.rs"

[[bin]]
name = "title-font-subset"
path = "scripts/title_font_subset.rs"
required-features = [ "font-tools" ]

[[bin]]
name = "html-img-host-rewrite"
path = "scripts/convert.rs"
required-features = [ "image-tools" ]

[[bin]]
name = "article-short-links"
path = "scripts/article_short_links.rs"

[[bin]]
name = "body-font-subset"
path = "scripts/body_font_subset.rs"
required-features = [ "font-tools" ]

[[bin]]
name = "deploy-markdown"
path = "scripts/deploy_markdown.rs"

[features]
default = []
font-tools = [ "dep:skera", "dep:walkdir", "dep:woofwoof", "dep:write-fonts" ]
image-tools = [ "dep:base64", "dep:image", "dep:walkdir" ]

[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = [ "derive" ] }
image = { version = "0.25", optional = true, default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "tiff",
  "webp"
] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sha2 = "0.10"
skera = { version = "0.3", optional = true }
chrono = { version = "0.4", default-features = false, features = [ "std" ] }
toml = "0.8"
walkdir = { version = "2", optional = true }
woofwoof = { version = "1", optional = true }
write-fonts = { version = "0.49", optional = true }

[dev-dependencies]
