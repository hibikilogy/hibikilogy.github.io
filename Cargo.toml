[package]
name = "hibikilogy-tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "title-font-subset"
path = "scripts/title_font_subset.rs"

[[bin]]
name = "html-img-host-rewrite"
path = "scripts/convert.rs"

[[bin]]
name = "article-short-links"
path = "scripts/article_short_links.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = [ "derive" ] }
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "tiff",
  "webp"
] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sha2 = "0.10"
skera = "0.3"
skrifa = "0.43"
toml = "0.8"
walkdir = "2"
woofwoof = "1"
write-fonts = "0.49"

[dev-dependencies]
