{% extends 'base.html' %}

{% block content %}
<div class="container">
  <div class="content">
    <section class="content-container">
      {% if paginator %}
        {% set pages = paginator.pages %}
      {% else %}
        {% set pages = section.pages %}
      {% endif %}
      {% for page in pages %}
        {{ <article.main page={page} config={config} lang={lang} show_cover={false} /> }}
      {% endfor %}
    </section>
  </div>
</div>
{% endblock %}
