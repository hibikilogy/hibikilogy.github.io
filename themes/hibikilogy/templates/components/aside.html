{% import 'components/toc.html' as toc %}

{% macro main(page) %}
{% if page.toc and page.extra.toc | default(value=true) != false %}
<div class="Aside" data-page-enter-item style="--page-enter-stage: 2">
  <div class="aside-container">
    {{ toc::main(page=page) }}
  </div>
</div>
{% endif %}
{% endmacro %}
