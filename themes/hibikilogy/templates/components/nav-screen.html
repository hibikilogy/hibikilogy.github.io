{% macro main() %}
<div class="NavScreen top">
  <div class="container">
    <nav aria-labelledby="main-nav-aria-label" role="navigation"
      aria-label="section navigation"
      class="NavScreenMenu menu">
      {% for item in config.extra.navbar %}
      {% if lang == item.code %}
      {% for nav in item.list %}
      {% if nav.link %}
      <a class="Link link NavScreenMenuLink" aria-expanded="false"
        aria-label="menu" role="button"
        href="{{ data::config_link(link=nav.link) }}"
        tabindex="0">
        <span>{{ nav.text }}</span>
      </a>
      {% else %}
      <div class="NavScreenMenuGroupLink">
        <button type="button" class="button" aria-haspopup="true"
          aria-expanded="false">
          <span class="text">
            <span>{{ nav.text }}</span>
            <span class="i-custom-down text-icon"></span>
          </span>
        </button>
        <div class="menu">
          <div class="Menu">
            <div class="items">
              {% for _nav in nav.items %}
              <div class="MenuLink">
                <a class="Link NavScreenMenuLink"
                  href="{{ data::config_link(link=_nav.link) }}"
                  target="_blank"
                  rel="noreferrer">
                  {{ _nav.text }}
                </a>
              </div>
              {% endfor %}
            </div>
          </div>
        </div>
        {% endif %}
        {% endfor %}
        {% endif %}
        {% endfor %}
      </nav>
  </div>
</div>
{% endmacro main %}
