{% set qa_answerer = answerer | default(value="") %}
<div class="mx-auto my-8 w-3/4">
  <blockquote class="rounded-lg border-l-0 bg-[#f7f7f7] px-4 py-4 space-y-3">
    <p class="qa-question">问：{{ question }}</p>
    {% if qa_answerer %}
    <p class="qa-answerer">{{ qa_answerer }}：</p>
    {% endif %}
    {{ body | markdown | safe }}
  </blockquote>
</div>
