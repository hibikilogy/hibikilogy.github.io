base_url = "https://hibikilogy.vercel.app/"
title = "京吹学报 (Dev Preview)"
description = "吹学著作集锦"
default_language = "zh"
theme = "hibikilogy"
compile_sass = true
minify_html = true
generate_feeds = true
author = "京吹学报"
generate_sitemap = true
build_search_index = true
hard_link_static = true
ignored_content = [ "temp.*" ]
taxonomies = [
  { name = "tags", feed = true, paginate_by = 12 },
  { name = "author", feed = true, paginate_by = 12 },
]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_path = true
include_date = true
include_author = true
include_content = true
truncate_content_length = 12000

[markdown]
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
bottom_footnotes = true
lazy_async_image = false
github_alerts = true
smart_punctuation = false
insert_anchor_links = "left"

[markdown.highlighting]
error_on_missing_language = false
style = "inline"
light_theme = "one-light"
dark_theme = "one-dark-pro"

[link_checker]
external_level = "warn"
skip_prefixes = [
  "http://[2001:db8::]/",
  "https://wiki.mbalib.com/",
  "https://ja.wikipedia.org/",
  "https://www.saraba1st.com/",
  "https://bbs.saraba1st.com/",
  "https://musescore.com/",
  "https://www.zhihu.com/",
  "https://zh.wikipedia.org/",
  "https://hibikilogy.github.io/",
  "https://baike.baidu.com/",
  "https://zhuanlan.zhihu.com/",
  "https://github.com/",
  "https://tieba.baidu.com/",
  "https://www.sony.com/",
  "https://store.steampowered.com/",
  "https://bangumi.tv/",
  "https://www.reddit.com/",
  "https://bbs.nga.cn/",
  "https://ngabbs.com/",
  "http://next.hyouka.ml:3000/",
  "https://nga.178.com/",
]

trailing_slashes = false

[slugify]
anchors = "on"
paths = "on"
taxonomies = "on"

[extra]
# Theme configuration overrides
article_section = "articles/_index.md"
stylesheets = [
  "styles/uno.css",
  "styles/source-han-serif-cn-vf.css",
  "styles/source-han-sans-sc-vf.css",
  "styles/source-han-sans-sc-vf.patch.css",
]
busuanzi = true
tag_cloud_bg = "/imgs/tag-cloud.svg"
tag_category_order = [
  "人物",
  "版块",
  "杂类",
]
tag_category_default = "杂类"
journal_logo = "/logo-wordmark.svg"
theme_color = "#ffffff"
twitter_card = "summary_large_image"
search_page_size = 12
meta_keywords = "吹学, 吹响吧！上低音号, 京吹, 京吹学报"
navbar_logo = "/logo.svg"
default_cover = "/imgs/tags.svg"
prefetch_urls = [
  "/imgs/tag-cloud.svg",
  "/search",
]
footer = [
  { code = "zh", tags_text = "相关标签", copyright = "本站收录文章著作权归原作者所有", count = "总查询数", frendlinks_text = "友情链接", list = [
    { text = "京吹学报", link = "$BASE_URL" },
    { text = "加入我们", link = "$BASE_URLdocs/join-us" },
    { text = "RSS", link = "$BASE_URLatom.xml" },
    { text = "GitHub", link = "https://github.com/hibikilogy/hibikilogy.github.io" },
  ], frendlinks = [
    { text = "中国珂学院维基", link = "https://wiki.sukasuka.cn/" },
    { text = "粳米团子", link = "https://kyoani.cn/" },
  ], contact = { text = "投稿邮箱 journal@kyoani.cn", link = "journal@kyoani.cn" } },
]
navbar = [
  { code = "zh", list = [
    { text = "我要投稿", link = "$BASE_URLdocs/contribute" },
    { text = "能力鉴定", link = "$BASE_URLdocs/assessment" },
    { text = "实体版特刊", link = "$BASE_URL" },
  ] },
]
slogan = [ { code = "zh", text = "吹学著作集锦", link = "$BASE_URL" }, ]

medium_zoom.enabled = true

chart.enabled = true

katex.enabled = true
katex.auto_render = true
katex.css_cdn = "https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css"
katex.css_integrity = "sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB"

[extra.image_host_rewrite]
old_host = "https://hibikilogy.vercel.app/"
new_host = "https://hibikilogy.interknot.site/"

[extra.favicon]
apple_touch_icon = "/apple-touch-icon-precomposed.png"
small_icon = "/favicon.ico"
svg_icon = "/logo-blue.svg"
safari_pinned_tab = "/apple-touch-icon-precomposed.png"
webmanifest = "/site.manifest"

[extra.analytics]
google = "G-DWY77Z5HMS"
